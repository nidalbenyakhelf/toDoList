<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toDoList</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="textBox">
      <button id="okBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
      <input type="text" id="textInput" />
      <span id="clearBtn"><i class="fa-solid fa-xmark"></i></span>
    </div>
    <div class="showBox">
      <ul id="ul"></ul>
    </div>
    <button id="deleteBtn"><i class="fa-solid fa-trash"></i></button>
    <button id="plusBtn"><i class="fa fa-plus"></i></button>
    <div class="plusCart" id="plusCart">
        <span>click double click for delete</span><br>
        <span>click one click for select jop</span>
        <span class="note"><i class="fa-regular fa-circle-xmark"></i>this to do list for leran</span>
    </div>
    <script src="js/script1.js"></script>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
